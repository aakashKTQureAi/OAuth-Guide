# fly.toml app configuration file generated for oauth-guide on 2026-10-28T19:56:23Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'oauth-guide'
primary_region = 'sin'

[build]

[[mounts]]
  source = 'guide_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
